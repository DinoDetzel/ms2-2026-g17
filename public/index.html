<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Interno - Bomberos</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="loginScreen">
        <div class="login-box">
            <div style="font-size: 50px; margin-bottom: 15px; color: #b80000;">🛡️</div>
            <h1>Sistema de control y gestion</h1>
            <p>Ing. White · Sistema Interno</p>
            <input type="text" id="nombre-login" placeholder="NOMBRE" autocapitalize="words" autocomplete="off">
            <input type="text" id="apellido-login" placeholder="APELLIDO" autocapitalize="words" autocomplete="off">
            <button class="btn-login" onclick="iniciarSesion()">INGRESAR</button>
        </div>
    </section>

    <section id="homeScreen">
        <header>
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="width:45px; height:45px; background:#b80000; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; color:white;">
                    🚒
                </div>
                <div>
                    <strong style="display:block; font-size:16px;">SISTEMA OPERATIVO</strong>
                    <span style="opacity:.6; font-size:11px;">BOMBEROS VOLUNTARIOS</span>
                </div>
            </div>
            <div class="user-info">
                <span id="user-display-name" style="color: #ff7a00; display:block;">Usuario</span>
                <button class="btn-salir" onclick="cerrarSesion()">CERRAR SESIÓN</button>
            </div>
        </header>

<h2>SECTORES</h2>
        <div class="sectors">
            <div class="sector mat" onclick="mostrarBotonesMateriales()">
                <div class="sector-content"><h3>Materiales</h3><span>Inventario · Herramientas</span></div>
            </div>
            <div class="sector auto" onclick="mostrarBotonesUnidades()">
                <div class="sector-content"><h3>Automotores</h3><span>Unidades · VTV · Servicios</span></div>
            </div>
            <div class="sector elec" onclick="entrarElectricidad()">
                <div class="sector-content"><h3>Electricidad</h3><span>Mantenimiento · Reparaciones</span></div>
            </div>
        </div>
